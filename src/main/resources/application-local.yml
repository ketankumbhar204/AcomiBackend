# Local machine + local PostgreSQL (acomi_db).
# Does not require Supabase. Override any value via environment variables.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acomi_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Admin@123}
    hikari:
      pool-name: AcomiHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true

  flyway:
    clean-disabled: false

  # GoDaddy Professional Email (Titan). Password only via SPRING_MAIL_PASSWORD.
  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:support@acomi.in}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

acomi:
  jwt:
    # Local-only default so developers can start without exporting JWT_SECRET.
    # Deployed profiles require JWT_SECRET from the environment (no default).
    secret: ${JWT_SECRET:acomi-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  otp:
    sender: ${ACOMI_OTP_SENDER:dev}
    # Set ACOMI_OTP_SENDER=twofactor and TWOFACTOR_API_KEY (rotated, never committed)
    # to send real SMS OTP locally. Default `dev` logs OTP to the backend console.
    # Skip registration OTP UI locally (send-otp returns verificationToken). Set
    # ACOMI_OTP_SKIP_REGISTRATION=false to force the normal OTP screen while developing.
    skip-registration-otp: ${ACOMI_OTP_SKIP_REGISTRATION:true}
    hash-secret: ${OTP_HASH_SECRET:local-dev-otp-hash-secret-not-for-production-use}
  cors:
    # Vite falls back to the next free port when 5173 is taken, so allow a small
    # range locally instead of failing every request with "Invalid CORS request".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176}
  discovery:
    # Local member Search includes converted test-lead Spaces (still hidden in prod).
    include-test-spaces: ${ACOMI_DISCOVERY_INCLUDE_TEST_SPACES:true}
  mail:
    # Local E2E uses GoDaddy Titan SMTP. Password stays in SPRING_MAIL_PASSWORD (never commit it).
    enabled: ${ACOMI_MAIL_ENABLED:true}
  push:
    enabled: ${ACOMI_PUSH_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.flywaydb: info
