# MVP Production (Render) + Supabase project acomi-prod.
# All secrets and connection details come from the deployment environment.
# Do not put Supabase passwords or JWT secrets in this file.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: AcomiHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

  # GoDaddy Professional Email (Titan). Enable with ACOMI_MAIL_ENABLED=true and SPRING_MAIL_PASSWORD.
  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:support@acomi.in}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

acomi:
  billing:
    monthly-rent:
      catch-up-on-startup: ${ACOMI_MONTHLY_RENT_CATCHUP_ON_STARTUP:true}
  jwt:
    secret: ${JWT_SECRET}
  otp:
    # 2Factor SMS. TWOFACTOR_API_KEY must be set on the host; no committed default.
    sender: twofactor
    skip-registration-otp: false
    hash-secret: ${OTP_HASH_SECRET}
    twofactor:
      api-key: ${TWOFACTOR_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    cookie:
      domain: ${ACOMI_AUTH_COOKIE_DOMAIN:}
      secure: true
      same-site: Lax
  mail:
    # New AWS cutover left this false. Enquiry contact emails will not send until true + SMTP password.
    enabled: ${ACOMI_MAIL_ENABLED:false}
    from: ${ACOMI_MAIL_FROM:support@acomi.in}
    from-name: ${ACOMI_MAIL_FROM_NAME:ACOMI Support}
    reply-to: ${ACOMI_MAIL_REPLY_TO:support@acomi.in}
    support-address: ${ACOMI_MAIL_SUPPORT_ADDRESS:support@acomi.in}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.flywaydb: warn
    org.springframework.web.client: warn
    org.springframework.http.client: warn
