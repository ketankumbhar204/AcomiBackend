# MVP Production (Render) + Supabase project amico-prod.
# All secrets and connection details come from the deployment environment.
# Do not put Supabase passwords or JWT secrets in this file.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: AmicoHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

amico:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.flywaydb: warn
